<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enterprise Security Gateway</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.4rem; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    input { padding: .5rem; margin: .25rem .25rem .25rem 0; width: 220px; }
    button { padding: .5rem .9rem; margin: .25rem .25rem .25rem 0; cursor: pointer; }
    pre { background: #f5f5f5; padding: .75rem; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
    .status { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Enterprise Multi-Tenant Security Gateway</h1>
  <p>Status: <span class="status" id="status">Not logged in</span></p>

  <section>
    <h3>1. Local login</h3>
    <input id="email" placeholder="email" value="employee@example.com" />
    <input id="password" type="password" placeholder="password" value="Employee@123" />
    <div>
      <button id="btn-login">Login</button>
      <button id="btn-register">Register (new Employee)</button>
    </div>
  </section>

  <section>
    <h3>2. Social login (OAuth 2.0)</h3>
    <a href="/api/v1/auth/google"><button>Login with Google</button></a>
    <a href="/api/v1/auth/github"><button>Login with GitHub</button></a>
  </section>

  <section>
    <h3>3. Tokens and protected routes</h3>
    <button id="btn-refresh">Refresh token (rotate)</button>
    <button id="btn-profile">GET /employee/profile</button>
    <button id="btn-payroll">POST /payroll/approve</button>
    <button id="btn-users">GET /users (SuperAdmin)</button>
    <button id="btn-logout">Logout</button>
  </section>

  <section>
    <h3>Response</h3>
    <pre id="out">Nothing yet.</pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
